<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Food Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#06C167}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:20px;padding:48px 40px;width:380px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .logo{font-size:1.6rem;font-weight:900;text-align:center;margin-bottom:4px}
  .logo b{color:var(--green)}
  .sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:30px}
  label{display:block;font-size:.82rem;font-weight:600;color:#555;margin-bottom:6px}
  .field{margin-bottom:18px}
  .pw-wrap{position:relative}
  input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.95rem;font-family:'Poppins',sans-serif;outline:none;transition:.2s}
  input:focus{border-color:var(--green)}
  .pw-wrap input{padding-right:44px}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#aaa}
  .btn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;margin-top:8px;transition:.2s}
  .btn:hover{background:var(--green)}
  .err{color:#e53935;font-size:.82rem;margin-top:10px;text-align:center;display:none}
  .back{text-align:center;margin-top:18px;font-size:.82rem}<br>  .back a{color:var(--green);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Food<b>Saver</b></div>
  <div class="sub">🔐 Admin Panel</div>
  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>Email</label>
      <input type="email" id="em" placeholder="Admin email" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="Password" required/>
        <button type="button" class="eye" onclick="var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password'">👁</button>
      </div>
    </div>
    <button class="btn" type="submit">Login to Dashboard</button>
    <div class="err" id="err">❌ Invalid email or password.</div>
  </form>
  <div class="back"><a href="index.html">← Back to Home</a></div>
</div>
<script>
if(localStorage.getItem('adminLogged')==='1') window.location.href='admin-dashboard.html';
function doLogin(e){
  e.preventDefault();
  var em=document.getElementById('em').value.trim().toLowerCase();
  var pw=document.getElementById('pw').value;
  if(em==='laxtline@gmail.com' && pw==='laxtline123'){
    localStorage.setItem('adminLogged','1');
    window.location.href='admin-dashboard.html';
  } else {
    document.getElementById('err').style.display='block';
  }
}
</script>
</body>
</html>
