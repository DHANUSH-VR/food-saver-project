<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login - Food Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#06C167;--dg:#048a48}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0a1a0a,#0d2a0d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:440px}
  .back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.82rem;margin-bottom:20px;transition:.2s}
  .back:hover{color:#fff}
  .card{background:#fff;border-radius:22px;padding:42px 38px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .card-logo{text-align:center;margin-bottom:24px}
  .card-logo .role-icon{width:64px;height:64px;background:rgba(6,193,103,.12);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px}
  .card-logo h2{font-size:1.3rem;font-weight:900;color:#111}
  .card-logo p{font-size:.78rem;color:#999;margin-top:4px}
  /* TABS */
  .tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:26px}
  .tab{flex:1;padding:9px;text-align:center;border:none;background:none;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;color:#888;cursor:pointer;border-radius:9px;transition:.2s}
  .tab.active{background:#fff;color:#111;box-shadow:0 1px 6px rgba(0,0,0,.1)}
  .sec{display:none}
  .sec.active{display:block}
  /* FORM */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.75rem;font-weight:700;color:#555;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .field input{width:100%;padding:12px 15px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.9rem;font-family:'Poppins',sans-serif;outline:none;transition:.2s;color:#111}
  .field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(6,193,103,.08)}
  .radio-row{display:flex;gap:16px;margin-top:4px}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:#555;cursor:pointer;font-weight:400}
  .radio-row input{accent-color:var(--green);width:16px;height:16px}
  .submit-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:'Poppins',sans-serif;transition:.2s;margin-top:6px;letter-spacing:.3px}
  .submit-btn:hover{background:var(--dg);transform:translateY(-1px)}
  .switch-link{text-align:center;margin-top:16px;font-size:.82rem;color:#888}
  .switch-link a{color:var(--green);font-weight:700;text-decoration:none;cursor:pointer}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:10px 14px;border-radius:8px;font-size:.78rem;margin-bottom:14px;display:none}
  .forgot{text-align:right;margin-top:-10px;margin-bottom:14px}
  .forgot a{font-size:.75rem;color:var(--green);font-weight:600;text-decoration:none;cursor:pointer}
  /* TOAST */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:10px;font-size:.82rem;font-weight:700;z-index:9999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);color:#fff;white-space:nowrap}
  .toast.show{display:block}
  .toast.ok{background:var(--green)}
  .toast.bad{background:#dc2626}
  /* RESET MODAL */
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
  .ov.show{display:flex}
  .rm{background:#fff;border-radius:18px;padding:36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .rm h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}
  .rm p{font-size:.8rem;color:#888;margin-bottom:18px}
  .rm input{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-family:'Poppins',sans-serif;font-size:.88rem;outline:none;margin-bottom:10px}
  .rm input:focus{border-color:var(--green)}
  .rm-btns{display:flex;gap:10px}
  .rm-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;font-size:.82rem}
  .rm-ok{background:var(--green);color:#fff}
  .rm-cancel{background:#f3f4f6;color:#555}
  .step-r{display:none}
  .step-r.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="ov" id="resetOv">
  <div class="rm">
    <h3>🔐 Reset Password</h3>
    <div class="step-r show" id="rs1">
      <p>Enter your registered email to get a reset code.</p>
      <input type="email" id="rEmail" placeholder="Your email"/>
      <div class="rm-btns"><button class="rm-cancel" onclick="closeReset()">Cancel</button><button class="rm-ok" onclick="sendCode()">Send Code</button></div>
    </div>
    <div class="step-r" id="rs2">
      <p>Enter the 6-digit code and set a new password.</p>
      <input type="text" id="rCode" placeholder="6-digit code" maxlength="6"/>
      <input type="password" id="rNew" placeholder="New password"/>
      <input type="password" id="rConfirm" placeholder="Confirm password"/>
      <div class="rm-btns"><button class="rm-cancel" onclick="closeReset()">Cancel</button><button class="rm-ok" onclick="doReset()">Reset</button></div>
    </div>
  </div>
</div>

<div class="wrap">
  <a href="index.html" class="back">← Back to Home</a>
  <div class="card">
    <div class="card-logo">
      <div class="role-icon">🧑</div>
      <h2>User Portal</h2>
      <p>Donate food &amp; track your donations</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('reg',this)">Create Account</button>
      <button class="tab" onclick="switchTab('login',this)">Sign In</button>
    </div>
    <!-- REGISTER -->
    <div class="sec active" id="reg">
      <div id="reg-err" class="err"></div>
      <form onsubmit="doRegister(event)">
        <div class="field"><label>Full Name</label><input type="text" name="name" placeholder="Your full name" required/></div>
        <div class="field"><label>Email Address</label><input type="email" name="email" placeholder="example@email.com" required/></div>
        <div class="field"><label>Password</label><input type="password" name="password" placeholder="Min 6 characters" required/></div>
        <div class="field">
          <label>Gender</label>
          <div class="radio-row">
            <label><input type="radio" name="gender" value="Male" required/> Male</label>
            <label><input type="radio" name="gender" value="Female"/> Female</label>
            <label><input type="radio" name="gender" value="Other"/> Other</label>
          </div>
        </div>
        <button class="submit-btn" type="submit">Create Account →</button>
      </form>
      <div class="switch-link">Already have an account? <a onclick="switchTab('login',document.querySelectorAll('.tab')[1])">Sign In</a></div>
    </div>
    <!-- LOGIN -->
    <div class="sec" id="login">
      <div id="login-err" class="err"></div>
      <form onsubmit="doLogin(event)">
        <div class="field"><label>Email Address</label><input type="email" id="lEmail" placeholder="Your email" required/></div>
        <div class="field"><label>Password</label><input type="password" id="lPass" placeholder="Your password" required/></div>
        <div class="forgot"><a onclick="openReset()">Forgot password?</a></div>
        <button class="submit-btn" type="submit">Sign In →</button>
      </form>
      <div class="switch-link">New user? <a onclick="switchTab('reg',document.querySelectorAll('.tab')[0])">Create Account</a></div>
    </div>
  </div>
</div>

<script>
if(localStorage.getItem('loggedUser')) window.location.href='index.html';

function toast(msg,type){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(type||'ok'); setTimeout(function(){t.classList.remove('show');},3000); }
function showErr(id,msg){ var el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideErr(id){ document.getElementById(id).style.display='none'; }

function switchTab(id,el){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active');});
  el.classList.add('active');
  document.getElementById(id).classList.add('active');
  hideErr('reg-err'); hideErr('login-err');
}

function doRegister(e){
  e.preventDefault();
  hideErr('reg-err');
  var name=e.target.name.value.trim();
  var email=e.target.email.value.trim().toLowerCase();
  var pass=e.target.password.value;
  var gender=e.target.gender.value;
  if(pass.length<6){showErr('reg-err','Password must be at least 6 characters.');return;}
  var users=JSON.parse(localStorage.getItem('users')||'[]');
  if(users.find(function(u){return u.email===email;})){showErr('reg-err','An account with this email already exists.');return;}
  users.push({name:name,email:email,password:pass,gender:gender,joinedAt:new Date().toLocaleString(),role:'user'});
  localStorage.setItem('users',JSON.stringify(users));
  localStorage.setItem('loggedUser',JSON.stringify({name:name,email:email,gender:gender,role:'user'}));
  // Welcome email
  var sub=encodeURIComponent('Welcome to Food Saver!');
  var body=encodeURIComponent('Hi '+name+',\n\nYour Food Saver account has been created!\n\nEmail: '+email+'\n\nStart donating food today!\n\nFood Saver Team\nlaxtline@gmail.com | 9938649590');
  window.open('mailto:'+email+'?subject='+sub+'&body='+body);
  toast('Account created! Welcome '+name+' 🎉');
  setTimeout(function(){window.location.href='index.html';},1200);
}

function doLogin(e){
  e.preventDefault();
  hideErr('login-err');
  var email=document.getElementById('lEmail').value.trim().toLowerCase();
  var pass=document.getElementById('lPass').value;
  var users=JSON.parse(localStorage.getItem('users')||'[]');
  var user=users.find(function(u){return u.email===email&&u.password===pass;});
  if(user){
    localStorage.setItem('loggedUser',JSON.stringify(user));
    toast('Welcome back, '+user.name+'! 👋');
    setTimeout(function(){window.location.href='index.html';},900);
  } else {
    showErr('login-err','Invalid email or password. Please try again.');
  }
}

// Reset password
var resetCode='',resetEmail='';
function openReset(){document.getElementById('resetOv').classList.add('show');document.getElementById('rs1').classList.add('show');document.getElementById('rs2').classList.remove('show');}
function closeReset(){document.getElementById('resetOv').classList.remove('show');}
function sendCode(){
  var email=document.getElementById('rEmail').value.trim().toLowerCase();
  var users=JSON.parse(localStorage.getItem('users')||'[]');
  if(!users.find(function(u){return u.email===email;})){toast('No account found with this email.','bad');return;}
  resetEmail=email;
  resetCode=Math.floor(100000+Math.random()*900000).toString();
  var sub=encodeURIComponent('Food Saver - Password Reset Code');
  var body=encodeURIComponent('Your reset code: '+resetCode+'\n\nValid for 10 minutes.\n\nFood Saver Team');
  window.open('mailto:'+email+'?subject='+sub+'&body='+body);
  alert('Your reset code: '+resetCode);
  document.getElementById('rs1').classList.remove('show');
  document.getElementById('rs2').classList.add('show');
}
function doReset(){
  if(document.getElementById('rCode').value.trim()!==resetCode){toast('Wrong code!','bad');return;}
  var np=document.getElementById('rNew').value;
  var cp=document.getElementById('rConfirm').value;
  if(np.length<6){toast('Min 6 characters','bad');return;}
  if(np!==cp){toast('Passwords do not match!','bad');return;}
  var users=JSON.parse(localStorage.getItem('users')||'[]');
  var idx=users.findIndex(function(u){return u.email===resetEmail;});
  if(idx!==-1){users[idx].password=np;localStorage.setItem('users',JSON.stringify(users));}
  toast('Password reset! Please login.');
  closeReset();
  switchTab('login',document.querySelectorAll('.tab')[1]);
}
</script>
</body>
</html>
