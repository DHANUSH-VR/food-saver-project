<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Donation Status - Food Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#06C167;--dg:#048a48}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:#f5f7f5}

  header{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:70px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
  .logo{font-size:1.6rem;font-weight:900}
  .logo b{color:var(--green)}
  nav a{text-decoration:none;color:#555;font-weight:500;margin-left:18px;font-size:.88rem;transition:.2s}
  nav a:hover,nav a.active{color:var(--green)}
  .nav-cta{background:var(--green);color:#fff!important;padding:9px 20px;border-radius:9px;font-weight:700!important}

  .wrap{max-width:700px;margin:0 auto;padding:40px 20px}

  /* TOP HERO */
  .page-hero{text-align:center;margin-bottom:36px}
  .page-hero .ph-icon{font-size:3.5rem;margin-bottom:12px}
  .page-hero h1{font-size:1.8rem;font-weight:900;color:#111;margin-bottom:8px}
  .page-hero p{color:#888;font-size:.92rem}

  /* SEARCH BOX */
  .search-card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:28px}
  .search-card h3{font-size:1rem;font-weight:800;margin-bottom:6px;color:#111}
  .search-card p{font-size:.82rem;color:#aaa;margin-bottom:20px}
  .search-row{display:flex;gap:10px}
  .search-row input{flex:1;padding:13px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:.92rem;font-family:'Poppins',sans-serif;outline:none;transition:.2s}
  .search-row input:focus{border-color:var(--green)}
  .search-btn{background:var(--green);color:#fff;border:none;padding:13px 24px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:'Poppins',sans-serif;white-space:nowrap;transition:.2s}
  .search-btn:hover{background:var(--dg)}
  .or-divider{text-align:center;color:#ccc;font-size:.8rem;margin:16px 0;position:relative}
  .or-divider::before,.or-divider::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:#eee}
  .or-divider::before{left:0}
  .or-divider::after{right:0}

  /* LOGGED IN GREETING */
  .greeting{background:linear-gradient(135deg,var(--green),var(--dg));border-radius:14px;padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .greeting h3{font-size:1rem;font-weight:800}
  .greeting p{font-size:.78rem;opacity:.85;margin-top:2px}
  .logout-btn{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.35);padding:7px 16px;border-radius:8px;font-weight:700;font-size:.78rem;cursor:pointer;font-family:'Poppins',sans-serif}
  .logout-btn:hover{background:rgba(255,255,255,.3)}

  /* RESULTS */
  .results-card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.07)}
  .results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .results-header h3{font-size:1rem;font-weight:800;color:#111}
  .donate-btn{background:var(--green);color:#fff;text-decoration:none;padding:9px 20px;border-radius:9px;font-size:.8rem;font-weight:700;transition:.2s}
  .donate-btn:hover{background:var(--dg)}

  /* DONATION ITEM CARD */
  .don-item{border:1.5px solid #f0f0f0;border-radius:12px;padding:18px 20px;margin-bottom:12px;transition:.2s;position:relative}
  .don-item:hover{border-color:#d0ead8;box-shadow:0 4px 16px rgba(6,193,103,.08)}
  .don-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap}
  .don-food{font-size:1rem;font-weight:800;color:#111}
  .don-date{font-size:.75rem;color:#bbb;margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700;white-space:nowrap}
  .badge.pending{background:#fff8e1;color:#f59e0b;border:1.5px solid #fde68a}
  .badge.assigned{background:#eff6ff;color:#3b82f6;border:1.5px solid #bfdbfe}
  .badge.delivered{background:#f0fdf4;color:#16a34a;border:1.5px solid #bbf7d0}
  .don-details{display:flex;flex-wrap:wrap;gap:8px}
  .det-pill{background:#f7f7f7;padding:5px 12px;border-radius:20px;font-size:.75rem;color:#555;display:flex;align-items:center;gap:5px}

  /* PROGRESS TRACKER */
  .progress-track{display:flex;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid #f5f5f5}
  .pt-step{flex:1;text-align:center;position:relative}
  .pt-step::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:#e5e7eb;z-index:0}
  .pt-step:last-child::after{display:none}
  .pt-dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:.8rem;position:relative;z-index:1;border:2px solid #e5e7eb;background:#fff}
  .pt-dot.done{background:var(--green);border-color:var(--green);color:#fff}
  .pt-dot.active{background:#fff;border-color:var(--green);color:var(--green);box-shadow:0 0 0 3px rgba(6,193,103,.2)}
  .pt-label{font-size:.65rem;color:#aaa;font-weight:500}
  .pt-label.done{color:var(--green);font-weight:700}
  .pt-label.active{color:var(--green);font-weight:700}

  /* EMPTY / NO RESULT */
  .empty-box{text-align:center;padding:48px 20px}
  .empty-box .ei{font-size:3.5rem;margin-bottom:14px}
  .empty-box h3{font-size:1.1rem;font-weight:800;margin-bottom:8px;color:#333}
  .empty-box p{font-size:.85rem;color:#aaa;margin-bottom:24px}
  .empty-box a{background:var(--green);color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:.9rem}

  /* QUICK ACTIONS */
  .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
  .qa-card{background:#fff;border-radius:14px;padding:20px;text-align:center;text-decoration:none;transition:.3s;box-shadow:0 2px 12px rgba(0,0,0,.05);border:2px solid transparent}
  .qa-card:hover{border-color:var(--green);transform:translateY(-2px)}
  .qa-card .qa-icon{font-size:2.2rem;margin-bottom:8px}
  .qa-card h4{font-size:.9rem;font-weight:800;color:#111;margin-bottom:4px}
  .qa-card p{font-size:.75rem;color:#999}

  @media(max-width:600px){
    header{padding:0 16px}
    nav{display:none}
    .search-row{flex-direction:column}
    .quick-actions{grid-template-columns:1fr}
    .progress-track{flex-direction:column;gap:8px}
    .pt-step::after{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="logo">Food<b>Saver</b></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="d-ngo.html">D NGO</a>
    <a href="contact.html">Contact</a>
    <a href="profile.html" class="active">My Donations</a>
    <a href="donate.html" class="nav-cta">Donate Now</a>
  </nav>
</header>

<div class="wrap">
  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="ph-icon">📦</div>
    <h1>Check Donation Status</h1>
    <p>Track your donated food — see if it has been picked up and delivered to those in need</p>
  </div>

  <!-- CONTENT will be injected here -->
  <div id="root"></div>
</div>

<script>
var user = JSON.parse(localStorage.getItem('loggedUser') || 'null');
var root = document.getElementById('root');

function getBadge(status) {
  if (status === 'delivered') return '<span class="badge delivered">✅ Delivered</span>';
  if (status === 'assigned')  return '<span class="badge assigned">🚚 In Delivery</span>';
  return '<span class="badge pending">⏳ Pending</span>';
}

function getProgress(status) {
  var steps = [
    {label:'Donated', icon:'🍱'},
    {label:'Verified', icon:'✓'},
    {label:'Picked Up', icon:'🛵'},
    {label:'Delivered', icon:'✅'}
  ];
  var activeIdx = status==='delivered' ? 3 : status==='assigned' ? 2 : 1;
  return '<div class="progress-track">' +
    steps.map(function(s, i) {
      var cls = i < activeIdx ? 'done' : i === activeIdx ? 'active' : '';
      return '<div class="pt-step">' +
        '<div class="pt-dot ' + cls + '">' + (cls==='done' ? '✓' : s.icon) + '</div>' +
        '<div class="pt-label ' + cls + '">' + s.label + '</div>' +
        '</div>';
    }).join('') +
  '</div>';
}

function renderDonation(d) {
  return '<div class="don-item">' +
    '<div class="don-top">' +
      '<div>' +
        '<div class="don-food">🍱 ' + d.food + '</div>' +
        '<div class="don-date">📅 ' + d.datetime + '</div>' +
      '</div>' +
      getBadge(d.status) +
    '</div>' +
    '<div class="don-details">' +
      '<span class="det-pill">🥗 ' + (d.type||'-') + '</span>' +
      '<span class="det-pill">📦 ' + (d.category||'-') + '</span>' +
      '<span class="det-pill">👥 ' + (d.quantity||'-') + '</span>' +
      '<span class="det-pill">📍 ' + (d.district||d.address||'-') + '</span>' +
    '</div>' +
    getProgress(d.status) +
  '</div>';
}

function renderDonations(donations, name) {
  if (!donations.length) {
    return '<div class="empty-box">' +
      '<div class="ei">📭</div>' +
      '<h3>No donations found</h3>' +
      '<p>No donations found for "' + name + '".<br>Try searching with a different name or phone number.</p>' +
      '<a href="donate.html">🍱 Donate Now</a>' +
    '</div>';
  }
  var html = '<div class="results-card">' +
    '<div class="results-header">' +
      '<h3>Found ' + donations.length + ' donation(s) for "' + name + '"</h3>' +
      '<a href="donate.html" class="donate-btn">+ Donate More</a>' +
    '</div>';
  donations.forEach(function(d) { html += renderDonation(d); });
  html += '</div>';
  return html;
}

function doSearch(query) {
  if (!query.trim()) return;
  var all = JSON.parse(localStorage.getItem('donations') || '[]');
  var q = query.trim().toLowerCase();
  var found = all.filter(function(d) {
    return (d.name && d.name.toLowerCase().includes(q)) ||
           (d.phoneno && d.phoneno.includes(q)) ||
           (d.email && d.email.toLowerCase().includes(q));
  });
  // Re-render with results below search
  renderPage(found, query.trim());
}

function renderPage(prefillDonations, prefillName) {
  var all = JSON.parse(localStorage.getItem('donations') || '[]');
  var html = '';

  // If logged in — show greeting
  if (user) {
    html += '<div class="greeting">' +
      '<div><h3>👋 Hello, ' + user.name + '!</h3><p>' + user.email + '</p></div>' +
      '<button class="logout-btn" onclick="logout()">Logout</button>' +
    '</div>';
  }

  // SEARCH BOX
  html += '<div class="search-card">' +
    '<h3>🔍 Search Your Donation</h3>' +
    '<p>Enter your name or phone number used during donation</p>' +
    '<div class="search-row">' +
      '<input type="text" id="searchInput" placeholder="Enter your name or phone number..." value="' + (prefillName||'') + '" onkeydown="if(event.key===\'Enter\') doSearch(this.value)"/>' +
      '<button class="search-btn" onclick="doSearch(document.getElementById(\'searchInput\').value)">Check Status</button>' +
    '</div>';

  // If logged in, show auto-search option
  if (user) {
    html += '<div class="or-divider">or</div>' +
      '<button onclick="doSearch(\'' + user.name + '\')" style="width:100%;padding:12px;border:1.5px dashed #06C167;background:rgba(6,193,103,.04);border-radius:10px;color:var(--green);font-weight:700;font-size:.88rem;cursor:pointer;font-family:Poppins,sans-serif;">🍱 Show My Donations (' + user.name + ')</button>';
  }
  html += '</div>';

  // Results
  if (prefillDonations !== undefined) {
    html += renderDonations(prefillDonations, prefillName);
  } else if (user) {
    // Auto show logged in user's donations
    var myDon = all.filter(function(d) {
      return d.name && d.name.toLowerCase() === user.name.toLowerCase();
    });
    if (myDon.length > 0) {
      html += renderDonations(myDon, user.name);
    } else {
      // Show quick actions
      html += '<div class="quick-actions">' +
        '<a href="donate.html" class="qa-card"><div class="qa-icon">🍱</div><h4>Donate Food</h4><p>Have surplus food? Donate now</p></a>' +
        '<a href="contact.html" class="qa-card"><div class="qa-icon">📞</div><h4>Contact Support</h4><p>Need help? Reach out to us</p></a>' +
      '</div>';
    }
  } else {
    // Not logged in, show quick actions
    html += '<div class="quick-actions">' +
      '<a href="donate.html" class="qa-card"><div class="qa-icon">🍱</div><h4>Donate Food</h4><p>Donate surplus food to needy</p></a>' +
      '<a href="user-signup.html" class="qa-card"><div class="qa-icon">👤</div><h4>Create Account</h4><p>Login to track donations easily</p></a>' +
    '</div>';
  }

  root.innerHTML = html;

  // Focus search input
  var inp = document.getElementById('searchInput');
  if (inp && !prefillName) inp.focus();
}

function logout() {
  localStorage.removeItem('loggedUser');
  user = null;
  renderPage();
}

// INIT
renderPage();
</script>



<script>
// Role-based nav update
(function(){
  var isAdmin = localStorage.getItem('adminLogged');
  var isDel = localStorage.getItem('deliveryPerson');
  var isUser = localStorage.getItem('loggedUser');
  document.addEventListener('DOMContentLoaded', function(){
    var nav = document.querySelector('nav');
    if(!nav) return;
    if(isAdmin){
      var db = document.createElement('a');
      db.href='admin-dashboard.html';
      db.setAttribute('style','background:#111;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:.8rem;text-decoration:none;');
      db.textContent='⚙️ Dashboard';
      nav.appendChild(db);
      var lo=document.createElement('a');
      lo.href='#'; lo.setAttribute('style','color:#e53935;font-size:.8rem;font-weight:600;text-decoration:none;padding:7px 10px;');
      lo.textContent='Logout';
      lo.onclick=function(e){e.preventDefault();localStorage.removeItem('adminLogged');location.href='index.html';};
      nav.appendChild(lo);
    } else if(isDel){
      var db=document.createElement('a');
      db.href='delivery-login.html';
      db.setAttribute('style','background:#FF6B00;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:.8rem;text-decoration:none;');
      db.textContent='🛵 My Dashboard';
      nav.appendChild(db);
      var lo=document.createElement('a');
      lo.href='#'; lo.setAttribute('style','color:#e53935;font-size:.8rem;font-weight:600;text-decoration:none;padding:7px 10px;');
      lo.textContent='Logout';
      lo.onclick=function(e){e.preventDefault();localStorage.removeItem('deliveryPerson');location.href='index.html';};
      nav.appendChild(lo);
    } else if(isUser){
      var u=JSON.parse(isUser);
      var lo=document.createElement('a');
      lo.href='#'; lo.setAttribute('style','color:#e53935;font-size:.8rem;font-weight:600;text-decoration:none;padding:7px 10px;');
      lo.textContent='Logout';
      lo.onclick=function(e){e.preventDefault();localStorage.removeItem('loggedUser');location.href='index.html';};
      nav.appendChild(lo);
    }
  });
})();
</script>

</body>
</html>
